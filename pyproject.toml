[project]
name = "gossip"
version = "0.0.1"
authors = [{ name = "Chris Vandevelde", email = "chris@vandevel.de" }]
description = "A broadcasting protocol inspired by gossip."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiostream>=0.7.1",
    "langcodes>=3.5.0",
    "netifaces>=0.11.0",
    "xsdata>=25.7",
]

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "pytest-cov>=7.0.0",
    "pytest-fixtures>=0.1.0",
]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

# Testing
[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "--cov=gossip"
